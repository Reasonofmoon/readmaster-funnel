<script type="module">
  import { mountOkgilEduHub } from "https://cdn.jsdelivr.net/gh/Reasonofmoon/okgil-edu-hub@b3d0cc1/src/mount.js";
  mountOkgilEduHub(document.getElementById("okgil-slot"), {
    proxyUrl: "/api/neis",
    dataUrl: "https://cdn.jsdelivr.net/gh/Reasonofmoon/okgil-edu-hub@b3d0cc1/data/neis",
  });
  const hide = () => {
    if (document.querySelector("#okgil-slot .okh-quote")) {
      document.getElementById("okgil-quote")?.classList.add("is-hidden");
    }
  };
  setTimeout(hide, 400);
  setTimeout(hide, 2000);
